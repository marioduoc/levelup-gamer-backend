spring.application.name=levelup-gamer-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelup}
spring.datasource.username=${DB_USER:levelup}
spring.datasource.password=${DB_PASSWORD:levelup}

# Las tablas se crean con los scripts de /sql, Hibernate solo valida el modelo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: en producción el secreto viene del .env (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-levelup-2026}
jwt.access-minutos=${JWT_ACCESS_MINUTOS:30}
jwt.refresh-dias=${JWT_REFRESH_DIAS:7}

app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# detras de nginx: respetar X-Forwarded-* (Swagger arma bien las URLs)
server.forward-headers-strategy=framework
