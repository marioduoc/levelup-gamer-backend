spring.application.name=levelup-gamer-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelup}
spring.datasource.username=${DB_USER:levelup}
spring.datasource.password=${DB_PASSWORD:levelup}

# Las tablas se crean con los scripts de /sql, Hibernate solo valida el modelo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
