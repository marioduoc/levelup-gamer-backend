name: levelup

# levanta la app completa: MySQL + API + frontend (nginx)
# requiere el repo del frontend clonado al lado: ../levelup-gamer-react
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: levelup
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos-mysql:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/levelup
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ../levelup-gamer-react
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-80}:80"
    depends_on:
      - backend

volumes:
  datos-mysql:
